<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shibuya Scene 2.0 — QFRONT viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #e8eaf0; }
      canvas { display: block; }
      #hud { position: fixed; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; max-width: 320px; }
      .panel { background: rgba(10, 12, 18, .72); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 8px 10px; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      button { background: #1c2230; color: #e8eaf0; border: 1px solid #3a4560; border-radius: 4px; padding: 4px 9px; cursor: pointer; font: inherit; }
      button.on { background: #3b5bdb; border-color: #5c7cfa; }
      #perf { font-family: ui-monospace, monospace; white-space: pre; }
      #status:empty { display: none; }
      #status { color: #ffb4a8; }
      #help { color: #a9b1c6; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="panel row">
        <button id="btn-day" class="on">昼</button><button id="btn-night">夜</button>
        <button id="btn-orbit" class="on">360°閲覧</button><button id="btn-walk">地上歩行</button>
        <button id="btn-q032">Q032視点</button>
      </div>
      <div class="panel" id="perf">計測中…</div>
      <div class="panel" id="status"></div>
      <div class="panel" id="help">360°: ドラッグで回転・ホイールで拡大<br />歩行: クリックで開始、WASD移動・マウスで視点・Shiftで走る・Escで解除</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
